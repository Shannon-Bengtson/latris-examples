context:
  background: The foundation funds a school mentoring programme; renewal depends on whether the theory
    holds up.
  audience: The foundation's board.
  intuition: Mentors seem to matter for attendance; the link to completion is unproven.
factors:
- label: Mentor training
- label: Weekly mentoring sessions
- label: Students mentored
- label: School attendance
- label: Grades
- label: School completion
links:
- from: Mentor training
  to: Weekly mentoring sessions
  reason: Trained mentors deliver consistent sessions.
- from: Weekly mentoring sessions
  to: Students mentored
  reason: Sessions are the programme's output.
- from: Students mentored
  to: School attendance
  reason: A trusted adult expecting you at school gets you there.
- from: School attendance
  to: Grades
  reason: Attendance is a precondition for learning.
- from: Grades
  to: School completion
  reason: Passing grades keep students enrolled.
sources:
- key: dubois2011
  title: How Effective Are Mentoring Programs for Youth? A Meta-Analytic Review
  authors:
  - DuBois, D.L.
  - Portillo, N.
  - Rhodes, J.E.
