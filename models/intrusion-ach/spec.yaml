context:
  background: Monday 03:12, the finance VLAN shows unusual outbound traffic; the incident team must brief
    the CISO by Friday.
  audience: The CISO and incident review panel.
  intuition: Probably a misconfigured backup job, but nobody wants to say so too early.
factors:
- label: Malicious exfiltration
- label: Misconfigured backup job
- label: Compromised vendor credential
- label: Traffic began minutes after a scheduled backup change
- label: Destination is a known cloud storage range
- label: No lateral movement observed
- label: Vendor reported a credential leak last month
